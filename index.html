function randTier(){
  var a = TUNE.ramp[0], b = TUNE.ramp[1];
  var p = Math.max(0, Math.min(1, (score - a) / (b - a)));
  var w = TUNE.wFrom.map(function(v, i){ return v + (TUNE.wTo[i] - v) * p; });
  var sum = 0, i;
  for (i = 0; i < w.length; i++) sum += w[i];
  var r = Math.random() * sum, acc = 0;
  for (i = 0; i < w.length; i++){ acc += w[i]; if (r <= acc) return i; }
  return 0;
}

function computeLayout(){
  var stage = document.getElementById('stage');
  var sw = stage ? stage.clientWidth : 0, sh = stage ? stage.clientHeight : 0;
  if (!sw) sw = window.innerWidth;
  if (!sh) sh = window.innerHeight;
  var vw = Math.min(sw, 520);
  var vh = sh;
  var oldW = W, oldH = H, first = !R.length;
  W = Math.round(vw); H = Math.round(vh);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R = TIERS.map(function(t){ return t.r * W * TUNE.sizeScale; });
  lineY = H * 0.215;
  if (!first && oldW !== W) {
    var k = W / oldW;
    for (var i = 0; i < balls.length; i++) {
      balls[i].x *= k; balls[i].y *= k; balls[i].r = R[balls[i].tier];
    }
  }
  aimX = Math.max(R[curTier], Math.min(aimX, W - R[curTier]));
  buildSprites();
  buildBg();
  buildFxGrads();
  initFx();
  sweepGrad = null;
}

var backdropImg = null, backdropReady = false;

function loadBackdrop(){
  if (!BACKDROP) return;
  var im = new Image();
  im.onload = function(){ backdropImg = im; backdropReady = true; buildBg(); };
  im.src = BACKDROP;
}

function loadFaces(){
  if (SKIN !== 'faces' || !FACES.length) return;
  var need = 0, done = 0;
  FACES.forEach(function(src, i){
    if (!src) return;
    need++;
    var im = new Image();
    im.onload = function(){
      faceImgs[i] = im; done++;
      if (done === need) { facesReady = true; buildSprites(); }
    };
    im.onerror = function(){ done++; if (done === need) buildSprites(); };
    im.src = src;
  });
  if (need === 0) facesReady = true;
}

function buildSprites(){
  var sc = 2;
  sprites = R.map(function(r, i){
    var pad = Math.ceil(r * 0.8);
    var side = Math.ceil((r + pad) * 2);
    var cv2 = document.createElement('canvas');
    cv2.width = side * sc; cv2.height = side * sc;
    var g = cv2.getContext('2d');
    g.scale(sc, sc);
    var cx = side / 2, cy = side / 2, t = TIERS[i];

    if (faceImgs[i]) {
      g.save();
      g.shadowColor = t.b;
      g.shadowBlur = r * 0.55;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.2832);
      g.fillStyle = t.b; g.fill();
      g.restore();
      g.save();
      g.beginPath(); g.arc(cx, cy, r * 0.955, 0, 6.2832); g.clip();
      g.drawImage(faceImgs[i], cx - r, cy - r, r * 2, r * 2);
      var gl = g.createRadialGradient(cx - r*0.35, cy - r*0.42, r*0.05, cx, cy, r * 1.05);
      gl.addColorStop(0, 'rgba(255,255,255,0.30)');
      gl.addColorStop(0.45, 'rgba(255,255,255,0.03)');
      gl.addColorStop(1, 'rgba(0,0,0,0.28)');
      g.fillStyle = gl;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.fill();
      g.restore();
      g.beginPath(); g.arc(cx, cy, r * 0.955, 0, 6.2832);
      g.lineWidth = Math.max(2, r * 0.085);
      g.strokeStyle = t.b;
      g.stroke();
    } else {
      var rg = g.createRadialGradient(cx - r*0.34, cy - r*0.38, r*0.10, cx, cy, r);
      rg.addColorStop(0, t.a);
      rg.addColorStop(0.62, t.b);
      rg.addColorStop(1, t.b);
      g.shadowColor = t.b;
      g.shadowBlur = r * 0.5;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.fillStyle = rg; g.fill();
      g.shadowBlur = 0;
      g.globalAlpha = 0.55;
      g.beginPath(); g.arc(cx - r*0.30, cy - r*0.34, r*0.28, 0, 6.2832);
      g.fillStyle = '#ffffff'; g.fill();
      g.globalAlpha = 1;
    }
    return {cv: cv2, side: side, half: side / 2};
  });
}

function buildBg(){
  var sc = DPR || 1;
  bgLayer = document.createElement('canvas');
  bgLayer.width = Math.round(W * sc);
  bgLayer.height = Math.round(H * sc);
  var g = bgLayer.getContext('2d');
  g.scale(sc, sc);

  var bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b1024');
  bg.addColorStop(0.55, '#07080f');
  bg.addColorStop(1, '#04040a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  if (backdropImg) {
    var ar = backdropImg.width / backdropImg.height, cr = W / H;
    var dw, dh;
    if (ar > cr) { dh = H; dw = H * ar; } else { dw = W; dh = W / ar; }
    g.globalAlpha = 0.62;
    if ('filter' in g) g.filter = 'blur(' + (1.5 * sc).toFixed(1) + 'px)';
    g.drawImage(backdropImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    if ('filter' in g) g.filter = 'none';
    g.globalAlpha = 1;
    var wash = g.createLinearGradient(0, 0, 0, H);
    wash.addColorStop(0, 'rgba(5,6,12,0.58)');
    wash.addColorStop(0.42, 'rgba(5,6,12,0.40)');
    wash.addColorStop(1, 'rgba(4,4,10,0.74)');
    g.fillStyle = wash; g.fillRect(0, 0, W, H);
  }

  // bagliore del fuoco, cotto nello sfondo
  var fireBaked = g.createRadialGradient(W * 0.5, H * 1.0, 0, W * 0.5, H * 1.0, H * 0.62);
  fireBaked.addColorStop(0, 'rgba(255,150,60,0.30)');
  fireBaked.addColorStop(0.45, 'rgba(226,96,32,0.12)');
  fireBaked.addColorStop(1, 'rgba(120,30,10,0)');
  g.fillStyle = fireBaked;
  g.fillRect(0, H * 0.38, W, H * 0.62);

  // braci dal basso
  var stg = g.createRadialGradient(W * 0.5, H * 1.02, 0, W * 0.5, H * 1.02, H * 0.55);
  stg.addColorStop(0, 'rgba(255,140,60,0.14)');
  stg.addColorStop(0.55, 'rgba(220,90,40,0.05)');
  stg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = stg;
  g.fillRect(0, H * 0.55, W, H * 0.45);

  // griglia da tavolo da guerra
  var step = Math.round(W / 8);
  g.lineWidth = 1;
  g.strokeStyle = 'rgba(120,200,255,0.045)';
  var k;
  for (k = step; k < W; k += step) {
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k, H); g.stroke();
  }
  for (k = step; k < H; k += step) {
    g.beginPath(); g.moveTo(0, k); g.lineTo(W, k); g.stroke();
  }

  g.fillStyle = 'rgba(255,255,255,0.035)';
  for (var gx = 18; gx < W; gx += 34) {
    for (var gy = 18; gy < H; gy += 34) {
      g.beginPath(); g.arc(gx, gy, 1, 0, 6.2832); g.fill();
    }
  }

  // faro dall'alto, come una sala stampa
  var spot = g.createRadialGradient(W * 0.5, -H * 0.05, 0, W * 0.5, -H * 0.05, H * 0.85);
  spot.addColorStop(0, 'rgba(190,220,255,0.10)');
  spot.addColorStop(0.5, 'rgba(150,190,255,0.03)');
  spot.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = spot; g.fillRect(0, 0, W, H);

  // vignettatura
  var vig = g.createRadialGradient(W * 0.5, H * 0.46, H * 0.22, W * 0.5, H * 0.46, H * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.62)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
}

function reset(){
  balls.length = 0; parts.length = 0; rings.length = 0; labels.length = 0;
  score = 0; gameOver = false; dropCd = 0; shake = 0; introT = 4.2;
  curTier = randTier(); nextTier = randTier();
  aimX = W / 2;
}

/* ---------------------------------------------------------------- audio */
function buzz(pattern){
  if (!canVibrate || !navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch(e){}
}

function audioOn(){
  if (ac) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ac = new AC();
  } catch(e){ ac = null; }
}
function blip(tier, vol){
  if (!ac || muted) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180 * Math.pow(1.22, tier), t);
  o.frequency.exponentialRampToValueAtTime(240 * Math.pow(1.22, tier), t + 0.09);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.25);
}
function thud(){
  if (!ac || muted) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.1);
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.15);
}

/* ------------------------------------------------------------ particles */
function burst(x, y, tier, n, power){
  var col = TIERS[Math.min(tier, TIERS.length - 1)];
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = (0.4 + Math.random()) * power;
    parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * 0.3,
      life: 0, max: 0.35 + Math.random() * 0.5,
      r: 1.5 + Math.random() * 3.5,
      col: Math.random() < 0.5 ? col.a : col.b
    });
  }
  rings.push({x:x, y:y, r: R[Math.min(tier, R.length-1)], life:0, max:0.42,
              col: col.a, w: 3});
}

/* --------------------------------------------------------------- physics */
var GRAV = 1, ITER = 4, REST = 0.10, FRIC = 0.22, MAXSPD = 3200;

function physics(dt){
  var i, j, b, n = balls.length;

  for (i = 0; i < n; i++) {
    b = balls[i];
    b.age += dt;
    b.vy += GRAV * dt;
    b.vx *= 0.9992; b.vy *= 0.9992;
    var sp2 = b.vx * b.vx + b.vy * b.vy;
    if (sp2 > MAXSPD * MAXSPD) {
      var k = MAXSPD / Math.sqrt(sp2);
      b.vx *= k; b.vy *= k;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }

  var toMerge = [];
  for (var it = 0; it < ITER; it++) {
    for (i = 0; i < n; i++) {
      var A = balls[i]; if (A.dead) continue;
      for (j = i + 1; j < n; j++) {
        var B = balls[j]; if (B.dead) continue;
        var dx = B.x - A.x, dy = B.y - A.y;
        var minD = A.r + B.r;
        var touch = Math.max(1.5, minD * 0.02);
        var reach = minD + touch;
        var d2 = dx*dx + dy*dy;
        if (d2 >= reach * reach) continue;
        var d = Math.sqrt(d2) || 0.0001;
        var nx = dx / d, ny = dy / d;
        var ov = minD - d;

        if (it === 0 && A.tier === B.tier && ov > -touch) {
          toMerge.push([A, B]);
          A.dead = true; B.dead = true;
          continue;
        }
        if (ov <= 0) continue;

        var mA = 1 / (A.r * A.r), mB = 1 / (B.r * B.r), mS = mA + mB;
        var push = Math.min(ov, 9);
        A.x -= nx * push * (mA / mS); A.y -= ny * push * (mA / mS);
        B.x += nx * push * (mB / mS); B.y += ny * push * (mB / mS);

        var rvx = B.vx - A.vx, rvy = B.vy - A.vy;
        var vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          var jn = -(1 + REST) * vn / mS;
          A.vx -= jn * mA * nx; A.vy -= jn * mA * ny;
          B.vx += jn * mB * nx; B.vy += jn * mB * ny;
          var tvx = rvx - vn * nx, tvy = rvy - vn * ny;
          A.vx += tvx * FRIC * (mA / mS); A.vy += tvy * FRIC * (mA / mS);
          B.vx -= tvx * FRIC * (mB / mS); B.vy -= tvy * FRIC * (mB / mS);
        }
      }
    }
    for (i = 0; i < n; i++) {
      b = balls[i]; if (b.dead) continue;
      if (b.x - b.r < 0) { b.x = b.r; if (b.vx < 0) b.vx *= -0.28; }
      if (b.x + b.r > W) { b.x = W - b.r; if (b.vx > 0) b.vx *= -0.28; }
      if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) b.vy *= -0.15; }
      if (b.y + b.r > H) {
        b.y = H - b.r;
        if (b.vy > 260) b.sq = Math.min(0.30, b.vy / 9000);
        if (b.vy > 0) b.vy *= -0.12;
      }
    }
  }

  for (i = 0; i < toMerge.length; i++) doMerge(toMerge[i][0], toMerge[i][1]);

  for (i = balls.length - 1; i >= 0; i--) if (balls[i].dead) balls.splice(i, 1);
}

function doMerge(A, B){
  var t = A.tier;
  var cx = (A.x + B.x) / 2, cy = (A.y + B.y) / 2;
  var vx = (A.vx + B.vx) * 0.5, vy = (A.vy + B.vy) * 0.5 - 40;
  score += MERGE_SCORE[t] || 10;
  shake = Math.min(shake + 2 + t, 10);
  burst(cx, cy, t, 10 + t * 4, 220 + t * 45);
  blip(t + 1, 0.10 + t * 0.012);
  buzz(t >= 4 ? 16 : 7);

  if (t === TIERS.length - 1) {
    score += FINAL_POP;
    pops++;
    shake = 14;
    burst(cx, cy, t, 90, 720);
    rings.push({x:cx, y:cy, r:R[t]*1.4, life:0, max:0.7, col:'#ffffff', w:5});
    labels.push({x:cx, y:cy, text: SKIN === 'faces' ? 'ATOMICA' : 'BOOM', life:0, max:1.1});
    blip(6, 0.2); blip(3, 0.16);
    return;
  }
  balls.push({x:cx, y:cy, vx:vx, vy:vy, r:R[t+1], tier:t+1, dt:0, age:0.9, sq:0, pop:1.45});
  if (labels.length > 7) labels.shift();
  labels.push({x:cx, y:cy - R[t+1] * 0.5, text:'+' + (MERGE_SCORE[t] || 10), life:0, max:0.85, pts:true});
}

function checkOver(dt){
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    if (b.age < 0.8) { b.dt = 0; continue; }
    if (b.y - b.r < lineY - 2) b.dt += dt;
    else b.dt = Math.max(0, b.dt - dt * 2.5);
    if (b.dt > 1.2) {
      gameOver = true;
      buzz([40, 70, 120]);
      return;
    }
  }
}

/* ------------------------------------------------------------------ loop */
var last = 0, acc = 0, STEP = 1 / 120;

function frame(ts){
  if (!last) last = ts;
  var dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;

  fpsAvg = fpsAvg * 0.94 + (1 / Math.max(dt, 0.004)) * 0.06;
  lowQ = fpsAvg < 26 ? 2 : (fpsAvg < 42 ? 1 : 0);

  updateFx(dt);
  if (!gameOver) {
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard < 8) { physics(STEP); acc -= STEP; guard++; }
    if (acc > STEP) acc = 0;
    if (dropCd > 0) dropCd -= dt;
    if (introT > 0) introT -= dt;
    checkOver(dt);
    if (score > best) {
      best = score;
      try { localStorage.setItem('orbita_best', String(best)); } catch(e){}
    }
  }

  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life += dt;
    p.vy += GRAV * 0.55 * dt;
    p.vx *= 0.988; p.vy *= 0.988;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life > p.max) parts.splice(i, 1);
  }
  for (i = 0; i < balls.length; i++) {
    var bb = balls[i];
    if (bb.sq) { bb.sq *= Math.exp(-dt * 11); if (bb.sq < 0.002) bb.sq = 0; }
    if (bb.pop && bb.pop > 1) { bb.pop += (1 - bb.pop) * Math.min(1, dt * 16); if (bb.pop < 1.005) bb.pop = 1; }
  }
  for (i = rings.length - 1; i >= 0; i--) {
    rings[i].life += dt;
    if (rings[i].life > rings[i].max) rings.splice(i, 1);
  }
  for (i = labels.length - 1; i >= 0; i--) {
    labels[i].life += dt;
    if (labels[i].life > labels[i].max) labels.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 34);

  render();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- render */
function drawBall(x, y, r, tier, alpha, sq, pop){
  var sp = sprites[tier];
  if (!sp) return;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  var s = sp.side * (r / R[tier]) * (pop || 1);
  var w = s * (1 + (sq || 0) * 0.55);
  var h = s * (1 - (sq || 0) * 0.55);
  ctx.drawImage(sp.cv, x - w / 2, y - h / 2, w, h);
  ctx.globalAlpha = 1;
}

var sweepGrad = null, fireGrad = null, smokeGrad = null;
var fpsAvg = 60, lowQ = 0;

var fx = { t: 0, embers: [], flashes: [] };

function newEmber(spread){
  return {
    x: Math.random() * W,
    y: spread ? Math.random() * H : H + 6 + Math.random() * 40,
    r: 0.9 + Math.random() * 2.2,
    vy: 8 + Math.random() * 26,
    sway: Math.random() * 6.2832,
    swaySpd: 0.6 + Math.random() * 1.4,
    a: 0.12 + Math.random() * 0.42
  };
}

function initFx(){
  fx.t = 0; fx.embers = []; fx.flashes = [];
  var n = Math.round(34 + W * 0.035);
  for (var i = 0; i < n; i++) fx.embers.push(newEmber(true));
}

function updateFx(dt){
  fx.t += dt;
  var i;
  var step = lowQ >= 2 ? 2 : 1;
  for (i = 0; i < fx.embers.length; i += step){
    var e = fx.embers[i];
    e.y -= e.vy * dt;
    e.x += Math.sin(fx.t * e.swaySpd + e.sway) * 10 * dt;
    if (e.y < H * 0.30) { fx.embers[i] = newEmber(false); }
  }
  if (fx.flashes.length === 0 && Math.random() < dt * 0.16) {
    fx.flashes.push({x: W * (0.15 + Math.random() * 0.7), y: H * (0.30 + Math.random() * 0.5),
                     life: 0, max: 0.55 + Math.random() * 0.35, r: W * (0.18 + Math.random() * 0.22)});
  }
  for (i = fx.flashes.length - 1; i >= 0; i--){
    fx.flashes[i].life += dt;
    if (fx.flashes[i].life > fx.flashes[i].max) fx.flashes.splice(i, 1);
  }
}

function drawFx(){
  var i;
  // fumo che scorre (un solo passaggio, basso costo)
  if (smokeGrad && lowQ < 2) {
    var sw = W * 0.85;
    var sx = ((fx.t * 6) % (W * 2.0)) - sw * 0.9;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.045;
    ctx.drawImage(smokeGrad, sx, H * 0.36, sw, sw);
    ctx.restore();
  }
  // sfarfallio del fuoco: solo una fascia in basso
  if (fireGrad && lowQ < 2) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var fl = 0.55 + 0.30 * Math.sin(fx.t * 2.7) + 0.15 * Math.sin(fx.t * 7.3 + 1.7);
    ctx.globalAlpha = Math.max(0.05, fl * 0.22);
    ctx.drawImage(fireGrad, 0, H - H * 0.20, W, H * 0.20);
    ctx.restore();
  }
  // braci
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var step = lowQ >= 2 ? 2 : 1;
  for (i = 0; i < fx.embers.length; i += step){
    var e = fx.embers[i];
    var fade = Math.min(1, (e.y - H * 0.30) / (H * 0.25));
    ctx.globalAlpha = e.a * Math.max(0, fade);
    ctx.fillStyle = i % 3 === 0 ? '#ffd9a0' : '#ff8a3d';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  // lampi lontani
  for (i = 0; i < fx.flashes.length; i++){
    var f = fx.flashes[i], k = f.life / f.max;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.sin(Math.PI * k) * 0.30;
    ctx.drawImage(flashGrad, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    ctx.restore();
  }
}

function buildFxGrads(){
  fireGrad = null; smokeGrad = null;
  var fg = document.createElement('canvas');
  fg.width = Math.round(W * 0.5); fg.height = Math.round(H * 0.18);
  var c = fg.getContext('2d');
  var g = c.createRadialGradient(fg.width * 0.5, fg.height, 0, fg.width * 0.5, fg.height, fg.height * 1.15);
  g.addColorStop(0, 'rgba(255,150,60,1)');
  g.addColorStop(0.45, 'rgba(220,90,30,0.45)');
  g.addColorStop(1, 'rgba(120,30,10,0)');
  c.fillStyle = g; c.fillRect(0, 0, fg.width, fg.height);
  fireGrad = fg;

  var sm = document.createElement('canvas');
  sm.width = Math.round(W * 0.7); sm.height = Math.round(W * 0.7);
  var c2 = sm.getContext('2d');
  var g2 = c2.createRadialGradient(sm.width/2, sm.height/2, 0, sm.width/2, sm.height/2, sm.width/2);
  g2.addColorStop(0, 'rgba(150,150,175,1)');
  g2.addColorStop(0.55, 'rgba(110,110,135,0.35)');
  g2.addColorStop(1, 'rgba(80,80,100,0)');
  c2.fillStyle = g2; c2.fillRect(0, 0, sm.width, sm.height);
  smokeGrad = sm;

  // lastra HUD preregistrata
  var hp = document.createElement('canvas');
  hp.width = Math.round(W); hp.height = Math.round(H * 0.105);
  var hc = hp.getContext('2d');
  var hg = hc.createLinearGradient(0, 0, 0, hp.height);
  hg.addColorStop(0, 'rgba(4,5,11,0.88)');
  hg.addColorStop(0.72, 'rgba(4,5,11,0.55)');
  hg.addColorStop(1, 'rgba(4,5,11,0)');
  hc.fillStyle = hg; hc.fillRect(0, 0, hp.width, hp.height);
  hudPlate = hp;

  // ombra di contatto
  var ss = document.createElement('canvas');
  ss.width = 128; ss.height = 40;
  var sc2 = ss.getContext('2d');
  var sg = sc2.createRadialGradient(64, 20, 0, 64, 20, 64);
  sg.addColorStop(0, 'rgba(0,0,0,0.75)');
  sg.addColorStop(0.55, 'rgba(0,0,0,0.35)');
  sg.addColorStop(1, 'rgba(0,0,0,0)');
  sc2.setTransform(1, 0, 0, 0.32, 0, 13.6);
  sc2.fillStyle = sg; sc2.beginPath(); sc2.arc(64, 20, 64, 0, 6.2832); sc2.fill();
  shadowSprite = ss;

  // lampo
  var fl = document.createElement('canvas');
  fl.width = fl.height = 128;
  var fc = fl.getContext('2d');
  var fgd = fc.createRadialGradient(64, 64, 0, 64, 64, 64);
  fgd.addColorStop(0, 'rgba(255,190,110,1)');
  fgd.addColorStop(1, 'rgba(255,120,40,0)');
  fc.fillStyle = fgd; fc.fillRect(0, 0, 128, 128);
  flashGrad = fl;
}

function drawSweep(){
  if (!backdropImg) return;
  var cx = W * 0.5, cy = H * 0.40, rad = Math.max(W, H) * 0.72;
  var a0 = (performance.now() * 0.00042) % 6.2832, a1 = a0 + 0.5;
  if (!sweepGrad) {
    sweepGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    sweepGrad.addColorStop(0, 'rgba(90,255,200,0.055)');
    sweepGrad.addColorStop(0.6, 'rgba(90,255,200,0.022)');
    sweepGrad.addColorStop(1, 'rgba(90,255,200,0)');
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, rad, a0, a1);
  ctx.closePath();
  ctx.fillStyle = sweepGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,255,215,0.10)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a0) * rad, cy + Math.sin(a0) * rad);
  ctx.stroke();
  ctx.restore();
}

var hudPlate = null, shadowSprite = null, flashGrad = null;

function drawHudPlate(){
  if (hudPlate) ctx.drawImage(hudPlate, 0, 0, W, H * 0.105);
}

function drawContactShadows(){
  ctx.save();
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    var gap = H - (b.y + b.r);
    if (gap > 34) continue;
    var k = Math.max(0, 1 - gap / 34);
    ctx.globalAlpha = 0.5 * k;
    var sw = b.r * 2.4, sh = b.r * 0.75;
    ctx.drawImage(shadowSprite, b.x - sw / 2, H - sh * 0.55, sw, sh);
  }
  ctx.restore();
}

function drawFrameEdge(){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.075)';
  ctx.lineWidth = 2;
  var r = 14;
  if (ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(1, 1, W - 2, H - 2, r); ctx.stroke();
  } else {
    ctx.strokeRect(1, 1, W - 2, H - 2);
  }
  ctx.restore();
}

function drawNextPanel(){
  var ring = Math.min(W * 0.085, 36);
  var cx = W - ring - 14, cy = ring + 14;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, ring, 0, 6.2832);
  ctx.fillStyle = 'rgba(8,10,20,0.58)'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();
  ctx.restore();
  drawBall(cx, cy, ring * 0.70, nextTier, 1);
  ctx.textAlign = 'center';
  ctx.font = '700 ' + Math.round(W * 0.024) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('PROSSIMA', cx, cy + ring + 13);
  ctx.textAlign = 'left';
}

function soundPillRect(){
  var w = Math.round(W * 0.205), h = Math.round(W * 0.062);
  return {x: W - 14 - w, y: H - 14 - h, w: w, h: h};
}

function drawCredit(){
  ctx.textAlign = 'left';
  ctx.font = '500 ' + Math.round(W * 0.021) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.26)';
  ctx.fillText('DeepSeek v4.1 Flash (1017) · satira, nessuna affiliazione', 16, H - 16);
  ctx.textAlign = 'left';
}

function drawSoundPill(){
  var r = soundPillRect();
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, r.h / 2);
  else ctx.rect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = 'rgba(8,10,20,0.72)'; ctx.fill();
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.stroke();
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.font = '600 ' + Math.round(r.h * 0.44) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.fillStyle = muted ? 'rgba(255,255,255,0.32)' : 'rgba(255,255,255,0.68)';
  ctx.fillText(muted ? 'audio off' : 'audio on', r.x + r.w / 2, r.y + r.h * 0.67);
  ctx.textAlign = 'left';
}

function render(){
  ctx.save();
  if (shake > 0.3) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  if (bgLayer) ctx.drawImage(bgLayer, 0, 0, W, H);
  drawFx();
  drawSweep();
  drawHudPlate();

  var dl = ctx.createLinearGradient(0, lineY - 26, 0, lineY);
  dl.addColorStop(0, 'rgba(255,80,110,0)');
  dl.addColorStop(1, 'rgba(255,80,110,0.10)');
  ctx.fillStyle = dl; ctx.fillRect(0, lineY - 26, W, 26);

  ctx.save();
  ctx.setLineDash([7, 9]);
  ctx.lineWidth = 1.5;
  var hot = false;
  for (var i = 0; i < balls.length; i++) if (balls[i].dt > 0.45) hot = true;
  ctx.strokeStyle = hot ? 'rgba(255,90,120,0.9)' : 'rgba(255,90,120,0.32)';
  ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(W, lineY); ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'left';
  ctx.font = '700 ' + Math.round(W * 0.085) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 10;
  ctx.fillText(String(score), 18, 18 + W * 0.075);
  ctx.shadowBlur = 0;
  ctx.font = '600 ' + Math.round(W * 0.030) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.34)';
  ctx.fillText('RECORD ' + best, 18, 18 + W * 0.112);

  ctx.textAlign = 'left';

  if (!gameOver) drawNextPanel();

  drawContactShadows();
  for (i = 0; i < balls.length; i++) {
    var b = balls[i];
    drawBall(b.x, b.y, b.r, b.tier, 1, b.sq, b.pop);
  }

  if (!gameOver) {
    var r0 = R[curTier];
    var cx = Math.max(r0 + 2, Math.min(aimX, W - r0 - 2));
    ctx.save();
    ctx.setLineDash([4, 10]);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, H * 0.15); ctx.lineTo(cx, H); ctx.stroke();
    ctx.restore();
    drawBall(cx, H * 0.105, r0, curTier, dragging ? 1 : 0.88);
  }

  for (i = 0; i < rings.length; i++) {
    var rg = rings[i];
    var k = rg.life / rg.max;
    ctx.globalAlpha = (1 - k) * 0.75;
    ctx.strokeStyle = rg.col;
    ctx.lineWidth = rg.w * (1 - k);
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rg.r * (1 + k * 1.9), 0, 6.2832);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for (i = 0; i < labels.length; i++) {
    var lb = labels[i], kk = lb.life / lb.max;
    ctx.globalAlpha = Math.max(0, 1 - kk * kk);
    ctx.textAlign = 'center';
    if (lb.pts) {
      ctx.font = '800 ' + Math.round(W * 0.044) + 'px ui-sans-serif,system-ui,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur = 8;
      ctx.fillText(lb.text, lb.x, lb.y - kk * W * 0.10);
    } else {
      ctx.font = '800 ' + Math.round(W * 0.075) + 'px ui-sans-serif,system-ui,sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ff2d6f';
      ctx.shadowBlur = 18;
      ctx.fillText(lb.text, lb.x, lb.y - kk * W * 0.22);
    }
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (!gameOver && introT > 0) {
    var a = Math.min(1, introT / 0.8);
    var pw = W - 2 * 26, ph = W * 0.46, px = 26, py = H * 0.30;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(12,14,28,0.86)';
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1.5;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 16); ctx.fill(); ctx.stroke(); }
    else { ctx.fillRect(px, py, pw, ph); ctx.strokeRect(px, py, pw, ph); }
    ctx.textAlign = 'left';
    var fs = Math.round(W * 0.036);
    ctx.font = '700 ' + fs + 'px ui-sans-serif,system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    var line2 = 'si toccano = si fondono';
    var line3 = '7 livelli, dal rosa al rosso';
    var line4 = 'due rosse esplodono: +500';
    if (SKIN === 'faces') {
      line2 = 'stesse facce si toccano = si fondono';
      line3 = '7 livelli: Salvini -> Kim';
      line4 = 'due Kim = atomica, +500';
    }
    ctx.fillText(SKIN === 'faces' ? 'due facce uguali' : 'due sfere uguali', px + 18, py + W * 0.085);
    ctx.fillText(line2, px + 18, py + W * 0.085 + fs * 1.35);
    ctx.font = '600 ' + Math.round(fs * 0.92) + 'px ui-sans-serif,system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(line3, px + 18, py + W * 0.085 + fs * 2.85);
    ctx.fillText(line4, px + 18, py + W * 0.085 + fs * 4.05);
    ctx.globalAlpha = 1;
  }

  drawCredit();
  if (!gameOver) drawSoundPill();
  drawFrameEdge();

  if (gameOver) {
    ctx.fillStyle = 'rgba(4,5,11,0.80)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 ' + Math.round(W * 0.085) + 'px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText('Pieno.', W/2, H*0.46);
    ctx.font = '600 ' + Math.round(W * 0.048) + 'px ui-sans-serif,system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.fillText(score + ' punti', W/2, H*0.46 + W*0.075);
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = '600 ' + Math.round(W * 0.036) + 'px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText('record ' + best, W/2, H*0.46 + W*0.122);
    var pulse = 0.6 + 0.4 * Math.sin(performance.now() / 320);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 ' + Math.round(W * 0.045) + 'px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText('tocca per rigiocare', W/2, H*0.70);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  ctx.restore();
}

/* ----------------------------------------------------------------- input */
function localX(e){
  var r = cv.getBoundingClientRect();
  return e.clientX - r.left;
}
function inSoundZone(x, y){
  var r = soundPillRect();
  return x >= r.x - 6 && x <= r.x + r.w + 6 && y >= r.y - 6 && y <= r.y + r.h + 6;
}
function drop(){
  if (gameOver || dropCd > 0) return;
  var r0 = R[curTier];
  var x = Math.max(r0 + 2, Math.min(aimX, W - r0 - 2));
  balls.push({x:x, y:H * 0.105, vx:0, vy:110, r:r0, tier:curTier, dt:0, age:0, sq:0, pop:1});
  burst(x, H * 0.105, curTier, 5, 90);
  introT = 0;
  thud();
  curTier = nextTier; nextTier = randTier();
  dropCd = 0.16;
}

cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  canVibrate = true;
  audioOn();
  if (ac && ac.state === 'suspended') ac.resume();
  if (gameOver) { reset(); return; }
  if (inSoundZone(localX(e), e.clientY - cv.getBoundingClientRect().top)) {
    muted = !muted; return;
  }
  dragging = true;
  aimX = localX(e);
});
cv.addEventListener('pointermove', function(e){
  if (!dragging || gameOver) return;
  e.preventDefault();
  aimX = localX(e);
});
cv.addEventListener('pointerup', function(e){
  if (dragging && !gameOver) { aimX = localX(e); drop(); }
  dragging = false;
});
cv.addEventListener('pointercancel', function(){ dragging = false; });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); drop(); }
  if (e.key === 'ArrowLeft') aimX = Math.max(0, aimX - 14);
  if (e.key === 'ArrowRight') aimX = Math.min(W, aimX + 14);
  if (e.key === 'r' || e.key === 'R') reset();
});

window.addEventListener('resize', function(){
  var before = W;
  computeLayout();
  if (Math.abs(before - W) > 6) { GRAV = 6.6 * W; }
});

/* ------------------------------------------------------------------ init */
computeLayout();
GRAV = 6.6 * W;
reset();
loadFaces();
loadBackdrop();
requestAnimationFrame(frame);

/* debug hook: solo per collaudo automatico, non usato dal gioco */
window.__orbita = {
  state: function(){
    return {score:score, over:gameOver, n:balls.length,
            tiers:balls.map(function(b){return b.tier;}), W:W, H:H,
            lineY:lineY, parts:parts.length, radii:R.slice(),
            pops:pops, skin:SKIN, faces:faceImgs.filter(Boolean).length,
            next:nextTier, cur:curTier, backdrop: !!backdropImg, muted: muted};
  },
  dropAt: function(x){ aimX = x; dropCd = 0; drop(); },
  seed: function(tier, x, y){
    balls.push({x:x, y:y, vx:0, vy:0, r:R[tier], tier:tier, dt:0, age:0, sq:0, pop:1});
  },
  reset: reset,
  pos: function(){ return balls.map(function(b){ return {x:b.x, y:b.y, r:b.r, t:b.tier}; }); },
  spriteStats: function(i){
    var sp = sprites[i]; if (!sp) return null;
    var g = sp.cv.getContext('2d');
    var d = g.getImageData(0, 0, sp.cv.width, sp.cv.height).data, v = [];
    for (var k = 0; k < d.length; k += 4) {
      if (d[k+3] < 40) continue;
      v.push(0.299*d[k] + 0.587*d[k+1] + 0.114*d[k+2]);
    }
    if (!v.length) return {px:0};
    var m = 0, i2;
    for (i2 = 0; i2 < v.length; i2++) m += v[i2];
    m /= v.length;
    var q = 0;
    for (i2 = 0; i2 < v.length; i2++) q += (v[i2]-m)*(v[i2]-m);
    return {px:v.length, mean:+m.toFixed(1), sd:+Math.sqrt(q/v.length).toFixed(1)};
  }
};
})();
</script>
